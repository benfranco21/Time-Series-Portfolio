  search: true
  back-to-top-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        menu:
          - text: "Project 1"
            href: projects/project-01-financial-forecasting/project-01.qmd
          - text: "Project 2"
            href: projects/project-02-garch-volatility/project-02.qmd
          - text: "Project 3"
            href: projects/project-03-eskom-demand/project-03.qmd
          - text: "Project 4"
            href: projects/project-04-state-space/project-04.qmd
      - text: "Journal"
        href: journal/index.qmd
      - text: "Section 1"
        menu:
          - text: "Overview"
            href: section-1/index.qmd
          - text: "Fundamentals"
            href: section-1/fundamentals.qmd
          - text: "ARCH/GARCH"
            href: section-1/arch-garch.qmd
          - text: "Spectral"
            href: section-1/Spectral_Analysis.qmd
      - text: "Section 2"
